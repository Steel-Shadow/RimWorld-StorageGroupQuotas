name: Build and publish rolling release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  MOD_NAME: StorageGroupQuotas
  RELEASE_TAG: continuous

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Source/packages.lock.json

      - name: Restore locked dependencies for RimWorld 1.6
        run: dotnet restore Source/StorageGroupQuotas.csproj --locked-mode

      - name: Build RimWorld 1.6 release DLL
        run: >-
          dotnet build Source/StorageGroupQuotas.csproj
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:OutputPath=${{ github.workspace }}/artifacts/bin/1.6/

      - name: Validate checked-in RimWorld 1.7 release DLL
        shell: bash
        run: |
          set -euo pipefail
          test -s "1.7/Assemblies/$MOD_NAME.dll"
          grep -aFq '.NETCoreApp,Version=v10.0' "1.7/Assemblies/$MOD_NAME.dll"
          grep -aFq 'UnityStubs' "1.7/Assemblies/$MOD_NAME.dll"
          if grep -aEq 'UnityEngine\.(CoreModule|IMGUIModule|TextRenderingModule)' "1.7/Assemblies/$MOD_NAME.dll"; then
            echo "The RimWorld 1.7 DLL still references legacy UnityEngine module assemblies." >&2
            exit 1
          fi

      - name: Create installable mod archive
        shell: bash
        run: |
          set -euo pipefail

          stage="$RUNNER_TEMP/$MOD_NAME"
          mkdir -p "$stage/1.6/Assemblies" "$stage/1.7/Assemblies"
          cp "artifacts/bin/1.6/$MOD_NAME.dll" "$stage/1.6/Assemblies/"
          cp "1.7/Assemblies/$MOD_NAME.dll" "$stage/1.7/Assemblies/"
          cp -R About Defs Languages "$stage/"
          cp LoadFolders.xml "$stage/"
          cp README.md "$stage/"

          (
            cd "$RUNNER_TEMP"
            zip -qr "$GITHUB_WORKSPACE/$MOD_NAME.zip" "$MOD_NAME"
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: StorageGroupQuotas-${{ github.sha }}
          path: StorageGroupQuotas.zip
          if-no-files-found: error
          archive: false

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Automated RimWorld 1.6 build and RimWorld 1.7 package from the latest `main` branch.

          Commit: [`${GITHUB_SHA}`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})

          Download `StorageGroupQuotas.zip`, extract it into RimWorld's `Mods` directory, and enable Harmony before this mod.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true
            gh release upload "$RELEASE_TAG" "$MOD_NAME.zip" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Continuous build" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "$MOD_NAME.zip" \
              --target "$GITHUB_SHA" \
              --title "Continuous build" \
              --notes-file "$notes" \
              --prerelease
          fi
